name: 🔧 CI Maven + Docker + MariaDB

# 🔁 Déclenche le workflow sur PR et push vers dev ou release/*
on:
  pull_request:
    branches:
      - dev
      - 'release/**'
    types: [opened, synchronize, closed]
  push:
    branches:
      - dev
      - 'release/**'

jobs:
  build-test-push:
    # 🎯 Conditions pour exécuter ce job
    if: >
      ( github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'synchronize' || 
        (github.event.action == 'closed' && github.event.pull_request.merged == true))
      )
      || ( github.event_name == 'push' )

    runs-on: ubuntu-latest  # 📦 Machine Ubuntu utilisée

    env:  # 🌍 Variables d'environnement
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_REGISTRY_NAME: ${{ secrets.DOCKER_REGISTRY_NAME }}
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: testdb

    steps:
      # 1️⃣ Récupération du code source
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{
            github.event_name == 'push' && github.ref_name ||
            (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) && github.event.pull_request.base.ref ||
            github.event.pull_request.head.ref
        }}

      # 2️⃣ Vérification des secrets obligatoires
      - name: ✅ Vérifier les secrets
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "❌ Missing DOCKERHUB_USERNAME"; exit 1)
          test -n "$DOCKER_REGISTRY_NAME" || (echo "❌ Missing DOCKER_REGISTRY_NAME"; exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "❌ Missing DOCKERHUB_TOKEN"; exit 1)

      # 3️⃣ Lancer MariaDB pour les tests d'intégration
      - name: 🐬 Lancer MariaDB pour les tests
        run: |
          docker run -d --name mariadb \
            -e MARIADB_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD \
            -e MARIADB_DATABASE=$MARIADB_DATABASE \
            -p 3306:3306 \
            mariadb:11
          echo "⏳ Attente de démarrage de MariaDB..."
          sleep 20

      # 4️⃣ Initialisation de la base avec les scripts SQL
      - name: 🗃️ Charger les scripts SQL
        run: |
          for file in ./databases/*.sql; do
            echo "⚙️ Exécution de $file"
            docker exec -i mariadb mariadb -uroot -p$MARIADB_ROOT_PASSWORD $MARIADB_DATABASE < "$file"
          done

      # 5️⃣ Tests unitaires Maven
      - name: 🧪 Lancer les tests unitaires
        run: mvn clean test

      # 6️⃣ Tests d'intégration Maven (ex: avec profil `integration`)
      - name: 🧪 Lancer les tests d'intégration
        run: mvn verify -Pintegration

      # 7️⃣ Nettoyage du conteneur MariaDB après les tests
      - name: 🧹 Nettoyer MariaDB
        if: always()
        run: docker rm -f mariadb

      # 8️⃣ Génération du tag Docker basé sur le commit
      - name: 🏷️ Générer le tag image
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 9️⃣ Connexion à Docker Hub
      - name: 🔐 Docker login
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # 🔟 Build & Push de l'image Docker
      - name: 🛠️ Build & Push image Docker
        run: |
          IMAGE_NAME="$DOCKERHUB_USERNAME/$DOCKER_REGISTRY_NAME/app"
          TAG=${{ steps.vars.outputs.IMAGE_TAG }}
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG
