name: 🔧 Build & Push Docker image

on:
  pull_request:
    branches:
      - dev
      - 'release/**'        # Ajout déclenchement PR vers release/*
    types:
      - opened
      - synchronize
      - closed

  push:
    branches:
      - 'release/**'        # Déclenche build lors du merge (push) sur release /*

jobs:
  build-and-push:
    if: >
      ( github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event.action == 'closed' && github.event.pull_request.merged == true))
      )
      ||
      ( github.event_name == 'push' )
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          # Si push sur release/*, checkout branche pushée
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: 🏷️ Générer le tag version depuis la branche
        id: vars
        run: |
          # Récupérer nom de la branche actuelle
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          else
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          echo "Branche: $BRANCH_NAME"
          # Extraire version style x.y.z ou x.y.z.n (pour hotfix)
          VERSION=$(echo "$BRANCH_NAME" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?')
          # fallback si rien trouvé : SHA court
          if [ -z "$VERSION" ]; then
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🔐 Docker login (Docker Hub)
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: 🛠️ Build & Push image Docker
        run: |
          docker build -t $DOCKERHUB_USERNAME/my-app:$VERSION .
          docker push $DOCKERHUB_USERNAME/my-app:$VERSION
